<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAwesome Guides</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ffcc00; /* SuperAwesome gul */
            margin-bottom: 10px;
        }

        p {
            color: #cccccc;
            margin-bottom: 30px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-card {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        /* Responsiv iframe */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border-radius: 5px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>SuperAwesome Guides</h1>
    <p>Find alle video guides til SuperAwesome herunder.</p>

    <div class="video-grid">
        <!-- Video 1 -->
        <div class="video-card">
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/ggPpoaaEfcc?si=DnedTdh4cEto6KI1" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Video 2 -->
        <div class="video-card">
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/Lrc743KCDv8?si=yv5o-7C1gqNW5pMq" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Video 3 -->
        <div class="video-card">
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/aSgxuxpJnrc?si=NFYVjLHsKqAD_Z57" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SuperAwesome</p>
    </footer>

</body>
</html>
